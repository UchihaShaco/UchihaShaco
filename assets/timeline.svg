    <radialGradient id="vignette" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.45"/></radialGradient>
    <pattern id="minor" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#7aa0cf" stroke-opacity="0.07" stroke-width="0.6"/></pattern>
    <pattern id="major" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#7aa0cf" stroke-opacity="0.16" stroke-width="0.8"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="sheet"><rect width="1200" height="440" rx="14"/></clipPath>
    <path id="tl" d="M92 236 H1108"/>
    <style>
      .sans { font-family: "Avenir Next", "Helvetica Neue", "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, "Liberation Mono", monospace; }
      .fade { opacity: 0; animation: fade .8s ease-out forwards; }
      @keyframes fade { to { opacity: 1 } }
      .draw { stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: draw 2.2s cubic-bezier(.4,0,.2,1) forwards; }
      @keyframes draw { to { stroke-dashoffset: 0 } }
      .rule { transform: scaleX(0); animation: rule 1s cubic-bezier(.4,0,.2,1) forwards; }
      @keyframes rule { to { transform: scaleX(1) } }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: .25; transform: scale(1) } 50% { opacity: .9; transform: scale(1.9) } }
      .scan { animation: scan 1.6s cubic-bezier(.4,0,.2,1) forwards; }
      @keyframes scan { from { transform: translateY(0); opacity: .9 } to { transform: translateY(var(--h)); opacity: 0 } }
      .trace { stroke-dasharray: 6 10; animation: trace 14s linear infinite; }
      @keyframes trace { to { stroke-dashoffset: -320 } }
      .sweep { animation: sweep 11s linear infinite; }
      @keyframes sweep { from { transform: translateX(-80px) } to { transform: translateX(1280px) } }
      @media (prefers-reduced-motion: reduce) { .fade, .draw, .rule, .scan { animation-duration: .01s; animation-delay: 0s } .pulse, .trace, .sweep { animation: none } }
    </style>
  </defs>
