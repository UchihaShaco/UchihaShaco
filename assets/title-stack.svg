<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 72" width="1200" height="72" role="img" aria-label="Section 02: STACK">
<defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans { font-family: "Avenir Next", "Helvetica Neue", "Segoe UI", Arial, sans-serif; } .mono { font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, "Liberation Mono", monospace; }
      .fade { opacity: 0; animation: fade .7s ease-out forwards; } @keyframes fade { to { opacity: 1 } }
      .rule { transform-origin: 0 0; transform: scaleX(0); animation: rule 1.1s .2s cubic-bezier(.4,0,.2,1) forwards; } @keyframes rule { to { transform: scaleX(1) } }
      .tick { animation: tick 2.4s ease-in-out infinite; } @keyframes tick { 0%,100% { opacity:.3 } 50% { opacity:1 } }
      @media (prefers-reduced-motion: reduce) { .fade,.rule { animation-duration:.01s; animation-delay:0s } .tick { animation:none } }
    </style></defs>
<rect width="1200" height="72" fill="#0d1c31" rx="10"/>
<rect x="0" y="0" width="6" height="72" fill="#d9a441" rx="3"/>
<text class="mono fade" x="28" y="44" fill="#d9a441" font-size="13" letter-spacing="3">SHEET 02</text>
<text class="sans fade" style="animation-delay:.15s" x="118" y="46" fill="#ece7d9" font-size="26" font-weight="800" letter-spacing="1">STACK</text>
<g class="rule" style="transform-origin:229px 0"><line x1="229" y1="38" x2="940" y2="38" stroke="#4fc3b8" stroke-opacity=".8" stroke-width="1.2"/><line x1="940" y1="31" x2="940" y2="45" stroke="#d9a441" stroke-width="1.5"/></g>
<text class="mono fade" style="animation-delay:.6s" x="1172" y="43" text-anchor="end" fill="#8fa3bd" font-size="12">what I build with</text>
